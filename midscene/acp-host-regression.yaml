            const expectedProvider = '${AXHUB_MAKE_E2E_PROMPT_PROVIDER}';
            const commentText = 'Midscene deterministic comment text for AI execution ' + runId;
            const response = await fetch(mockWebBaseUrl + '/__axhub-mock-acp/requests');
            const payload = await response.json().catch(() => null);
            if (!response.ok || !Array.isArray(payload?.requests)) {
              throw new Error('Mock ACP request log is unavailable: ' + JSON.stringify({ status: response.status, payload }));
            }
            const request = payload.requests
              .slice()
              .reverse()
              .find((item) => item?.body?.id === 'midscene-comment-ai-smoke-run-' + runId);
            const messageText = String(request?.body?.messages?.[0]?.parts?.[0]?.text || '');
            const comments = Array.isArray(request?.body?.context?.comments)
              ? request.body.context.comments
              : [];
            const hasCommentContext = comments.some((comment) => comment?.comment === commentText);
            const hasCommentPrompt = messageText.includes(commentText);
            const providerMatches = !expectedProvider || request?.body?.provider === expectedProvider;
            if (!request || !hasCommentContext || !hasCommentPrompt || !providerMatches) {
              throw new Error('Comment AI execution did not reach mock ACP with expected comment context: ' + JSON.stringify({
                hasRequest: Boolean(request),
                hasCommentContext,
                hasCommentPrompt,
                expectedProvider,
                actualProvider: request?.body?.provider,
                messageText,
                comments,
              }));
            }
            return {
              requestCount: payload.requests.length,
              provider: request.body.provider,
              hasCommentContext,
              hasCommentPrompt,
            };
          })()
