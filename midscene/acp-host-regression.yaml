              { title: 'E2E 运行中样式产物 ' + '${AXHUB_MAKE_E2E_RUN_ID}', status: '生成中', kind: '图片' },
              { title: 'E2E 失败样式产物 ' + '${AXHUB_MAKE_E2E_RUN_ID}', status: '失败', kind: '文档' },
            ];
            const getHistoryPanel = () => {
              const refresh = document.querySelector('button[aria-label="刷新生成记录"]');
              let current = refresh;
              while (current && current !== document.body) {
