                  return current;
                }
                current = current.parentElement;
              }
              return document.body;
            };
            const findCard = (title) => {
              const panel = getHistoryPanel();
              const titleNode = Array.from(panel.querySelectorAll('div, span')).find((node) => node.textContent?.trim() === title);
              let current = titleNode;
              while (current && current !== document.body) {
                const text = String(current.textContent || '');
                if (current.querySelector?.('button[aria-label="添加到画布"]') && text.includes(title) && text.length < 800) {
                  return current;
                }
                current = current.parentElement;
              }
              return null;
            };
            const cards = expected.map((item) => ({ ...item, card: findCard(item.title) }));
            const missing = cards.filter((item) => !item.card).map((item) => item.title);
            if (missing.length) {
              throw new Error(JSON.stringify({ reason: 'Missing AI artifact history cards', missing }));
            }
            const statusFailures = cards
              .filter((item) => !item.card.textContent.includes(item.status) || !item.card.textContent.includes(item.kind))
              .map((item) => ({ title: item.title, expectedStatus: item.status, expectedKind: item.kind, text: item.card.textContent }));
            if (statusFailures.length) {
              throw new Error(JSON.stringify({ reason: 'AI artifact status or kind mismatch', statusFailures }));
            }
            const actualOrder = cards
              .slice()
              .sort((left, right) => {
                const position = left.card.compareDocumentPosition(right.card);
                return position & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
              })
              .map((item) => item.title);
            const expectedOrder = expected.map((item) => item.title);
            if (JSON.stringify(actualOrder) !== JSON.stringify(expectedOrder)) {
              throw new Error(JSON.stringify({ reason: 'AI artifact history order mismatch', expectedOrder, actualOrder }));
