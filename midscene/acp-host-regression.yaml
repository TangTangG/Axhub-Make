web:
  url: ${AXHUB_MAKE_E2E_BASE_URL}
  viewportWidth: 1440
  viewportHeight: 1000
  cdpEndpoint: ${MIDSCENE_CDP_ENDPOINT}
  waitForNetworkIdle:
    timeout: 5000
    continueOnNetworkIdleError: true
  output: ${AXHUB_MAKE_E2E_OUTPUT}
  unstableLogContent: ${AXHUB_MAKE_E2E_LOG}

agent:
  testId: axhub-make-acp-host-${AXHUB_MAKE_E2E_RUN_ID}
  groupName: Axhub Make ACP Host Regression
  groupDescription: Regression for Make host sidebar, canvas, placeholder, ACP runtime availability, iframe context postMessage, and URL deep links.
  generateReport: true
  autoPrintReportMsg: true
  reportFileName: axhub-make-acp-host-${AXHUB_MAKE_E2E_RUN_ID}
  replanningCycleLimit: 30
  aiActContext: >
    You are testing Axhub Make, a Chinese product UI that embeds ACP UI as a
    right-side assistant iframe. Prefer visible controls over DOM selectors.
    Important visible labels include 原型, 画布, 设计, 打开 AI, ACP UI, 项目设置,
    资源画布, and 好的方案从一份草稿开始.
  cache:
    id: axhub-make-acp-host
    strategy: read-write

tasks:
  - name: Bootstrap canvas deep link
    flow:
      - javascript: |
          (() => ({
            activeProjectId: '${AXHUB_MAKE_E2E_PROJECT_ID}',
            hasCanvasPrototype: Boolean('${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}'),
            hasPreviewPrototype: Boolean('${AXHUB_MAKE_E2E_PREVIEW_PROTOTYPE}'),
            verifiedByRunnerBeforeMidsceneAttach: true,
          }))()
        name: wait_for_regression_project_resources
      - javascript: |
          (() => {
            const scheduleNavigation = (href) => window.setTimeout(() => {
              window.location.href = href;
            }, 50);
            const baseUrl = '${AXHUB_MAKE_E2E_BASE_URL}';
            const url = new URL(baseUrl);
            url.searchParams.set('projectId', '${AXHUB_MAKE_E2E_PROJECT_ID}');
            url.searchParams.set('p', '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}');
            url.searchParams.set('v', 'canvas');
            if (window.location.href !== url.toString()) {
              scheduleNavigation(url.toString());
              return { url: url.toString(), navigated: true };
            }
            return { url: url.toString(), navigated: false };
          })()
        name: open_canvas_url
      - javascript: |
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const deadline = Date.now() + 75000;
            let state = null;
            while (Date.now() < deadline) {
              const text = String(document.body?.innerText || '');
              const url = new URL(window.location.href);
              const generationHistoryTrigger = Array.from(document.querySelectorAll('button, [role="button"]')).find((node) => {
                const label = [node.getAttribute?.('aria-label'), node.getAttribute?.('title'), node.textContent].filter(Boolean).join(' ');
                return label.includes('生成记录');
              });
              state = {
                href: window.location.href,
                hasProject: url.searchParams.get('projectId') === '${AXHUB_MAKE_E2E_PROJECT_ID}',
                hasCanvasPrototype: url.searchParams.get('p') === '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}',
                hasCanvasMode: url.searchParams.get('v') === 'canvas',
                hasCanvasNav: text.includes('画布'),
                hasPrototypeNav: text.includes('原型'),
                hasDesignNav: text.includes('设计'),
                hasGenerationHistoryTrigger: Boolean(generationHistoryTrigger),
                hasCanvasText: text.includes('资源画布') || text.includes('好的方案从一份草稿开始') || text.includes('画布'),
                textLength: text.trim().length,
                textSample: text.slice(0, 400),
              };
              if (state.hasProject && state.hasCanvasPrototype && state.hasCanvasMode && state.hasPrototypeNav && (state.hasCanvasText || state.hasGenerationHistoryTrigger)) {
                return state;
              }
              await sleep(1000);
            }
            throw new Error('Make canvas deep link is not ready after bootstrap wait: ' + JSON.stringify(state));
          })()
        name: canvas_deep_link_ready
      - javascript: |
          (() => {
            const text = String(document.body?.innerText || '');
            const url = new URL(window.location.href);
            const generationHistoryTrigger = Array.from(document.querySelectorAll('button, [role="button"]')).find((node) => {
              const label = [node.getAttribute?.('aria-label'), node.getAttribute?.('title'), node.textContent].filter(Boolean).join(' ');
              return label.includes('生成记录');
            });
            const state = {
              href: window.location.href,
              hasProject: url.searchParams.get('projectId') === '${AXHUB_MAKE_E2E_PROJECT_ID}',
              hasCanvasPrototype: url.searchParams.get('p') === '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}',
              hasCanvasMode: url.searchParams.get('v') === 'canvas',
              hasCanvasNav: text.includes('画布'),
              hasPrototypeNav: text.includes('原型'),
              hasGenerationHistoryTrigger: Boolean(generationHistoryTrigger),
              hasCanvasText: text.includes('资源画布') || text.includes('好的方案从一份草稿开始') || text.includes('画布'),
            };
            if (!state.hasProject || !state.hasCanvasPrototype || !state.hasCanvasMode || !state.hasPrototypeNav || (!state.hasCanvasText && !state.hasGenerationHistoryTrigger)) {
              throw new Error('Canvas workspace deterministic verification failed: ' + JSON.stringify(state));
            }
            return state;
          })()
        name: verify_canvas_workspace_visible_for_visual_regression
      - javascript: |
          (() => ({ report: "Canvas deep link", content: "Make opened the configured prototype in canvas mode from the short deep link." }))()

  - name: Canvas assistant active canvas write
    flow:
      - javascript: |
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const api = window.__AXHUB_EXCALIDRAW_API__;
            if (!api?.getSceneElements) {
              throw new Error('Canvas API is not available before active canvas write test.');
            }
            window.__AXHUB_E2E_REALTIME_ORIGINAL_ELEMENTS__ = api.getSceneElements();
            window.__AXHUB_E2E_REALTIME_ORIGINAL_APP_STATE__ = api.getAppState?.() || {};
            const runId = '${AXHUB_MAKE_E2E_RUN_ID}';
            const expectedArtifacts = [
              {
                id: 'make-e2e-realtime-assistant-prototype-' + runId,
                kind: 'prototype',
                previewKind: 'web',
                title: 'E2E 实时原型产物',
              },
              {
                id: 'make-e2e-realtime-assistant-image-' + runId,
                kind: 'image',
                previewKind: 'image',
                title: 'E2E 实时图片产物',
              },
              {
                id: 'make-e2e-realtime-assistant-drawio-' + runId,
                kind: 'drawio',
                previewKind: 'drawio',
                title: 'E2E 实时 Drawio 产物',
              },
              {
                id: 'make-e2e-realtime-assistant-document-' + runId,
                kind: 'document',
                previewKind: 'doc',
                title: 'E2E 实时文档产物',
              },
            ];
            window.__AXHUB_E2E_REALTIME_EXPECTED_ARTIFACTS__ = expectedArtifacts;
            window.__AXHUB_E2E_REALTIME_PROMPT_TEXT__ = [
              '请通过右侧 ACP UI 生成并回写四类画布规范产物。',
              '需要包含 prototype、image、drawio、document。',
              'run id: ' + runId,
              'artifact ids: ' + expectedArtifacts.map((artifact) => artifact.id).join(', '),
            ].join('\n');
            const deadline = Date.now() + 45000;
            let lastState = null;
            while (Date.now() < deadline) {
              let textarea = document.querySelector('textarea[aria-label="画布 AI 输入"]');
              const launcher = document.querySelector('[data-axhub-canvas-start-ai-launcher]');
              if (!textarea && launcher) {
                launcher.click();
                await sleep(300);
              }
              const documentSceneButton = Array.from(document.querySelectorAll('[data-axhub-canvas-start-scene-switcher] button'))
                .find((button) => button.textContent?.trim() === '文档');
              documentSceneButton?.click();
              textarea = document.querySelector('textarea[aria-label="画布 AI 输入"]');
              lastState = {
                hasComposer: Boolean(textarea),
                hasLauncher: Boolean(launcher),
                composerAriaLabel: textarea?.getAttribute?.('aria-label') || '',
              };
              if (textarea) {
                return {
                  expectedArtifacts,
                  promptText: window.__AXHUB_E2E_REALTIME_PROMPT_TEXT__,
                  composerAriaLabel: textarea.getAttribute('aria-label'),
                };
              }
              await sleep(500);
            }
            throw new Error('Canvas AI composer did not appear for active canvas write test: ' + JSON.stringify(lastState));
          })()
        name: open_canvas_start_ai_composer_for_active_canvas_write
      - javascript: |
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const promptText = String(window.__AXHUB_E2E_REALTIME_PROMPT_TEXT__ || '');
            const textarea = document.querySelector('textarea[aria-label="画布 AI 输入"]');
            if (!textarea) {
              throw new Error('Canvas AI composer textarea is not available for prompt submission.');
            }
            const valueSetter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value')?.set;
            valueSetter?.call(textarea, promptText);
            textarea.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: promptText }));
            textarea.focus();
            textarea.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
            textarea.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', bubbles: true, cancelable: true }));
            await sleep(600);
            const root = textarea.closest('[data-axhub-canvas-start-composer]') || textarea.closest('.ax-placeholder-display-composer') || document;
            const buttons = Array.from(root.querySelectorAll('button')).filter((button) => {
              const rect = button.getBoundingClientRect();
              return rect.width > 0 && rect.height > 0 && !button.disabled;
            });
            const sendButton = root.querySelector('button[aria-label="发送"], button[title="发送"], button[type="submit"], button.aui-composer-send')
              || buttons.find((button) => /发送|send|submit/i.test([
                button.getAttribute('aria-label'),
                button.getAttribute('title'),
                button.className,
                button.textContent,
              ].filter(Boolean).join(' ')))
              || buttons.at(-1);
            if (!sendButton) {
              throw new Error('Canvas AI composer send button is not available: ' + JSON.stringify(buttons.map((button) => ({
                ariaLabel: button.getAttribute('aria-label'),
                title: button.getAttribute('title'),
                className: String(button.className || ''),
                text: button.textContent?.trim() || '',
              }))));
            }
            sendButton.click();

            const deadline = Date.now() + 30000;
            let lastState = null;
            while (Date.now() < deadline) {
              const iframe = Array.from(document.querySelectorAll('iframe')).find((candidate) => {
                const src = candidate.src || '';
                const title = candidate.title || '';
                return src.includes('${AXHUB_MAKE_E2E_MOCK_ACP_WEB_BASE_URL}') || title.includes('ACP');
              });
              const bodyText = String(document.body?.innerText || '');
              lastState = iframe ? {
                src: iframe.src,
                title: iframe.title,
                width: iframe.clientWidth,
                height: iframe.clientHeight,
                hasContentWindow: Boolean(iframe.contentWindow),
                hasPromptText: Boolean(promptText),
                hasGeneratingCopy: /生成|AI|ACP/.test(bodyText),
              } : {
                iframes: Array.from(document.querySelectorAll('iframe')).map((candidate) => ({
                  src: candidate.src || '',
                  title: candidate.title || '',
                  width: candidate.clientWidth,
                  height: candidate.clientHeight,
                })),
                hasPromptText: Boolean(promptText),
              };
              if (iframe?.contentWindow && iframe.clientWidth >= 280 && iframe.clientHeight >= 400) {
                return {
                  promptText,
                  submittedThroughVisibleComposer: true,
                  iframeSrc: iframe.src,
                  iframeTitle: iframe.title,
                  iframeWidth: iframe.clientWidth,
                  iframeHeight: iframe.clientHeight,
                };
              }
              await sleep(500);
            }
            throw new Error('ACP iframe was not visible after canvas composer prompt submission: ' + JSON.stringify(lastState));
          })()
        name: submit_canvas_start_ai_prompt_for_active_canvas_write
      - javascript: |
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const runId = '${AXHUB_MAKE_E2E_RUN_ID}';
            const expectedArtifacts = window.__AXHUB_E2E_REALTIME_EXPECTED_ARTIFACTS__ || [
              { id: 'make-e2e-realtime-assistant-prototype-' + runId, kind: 'prototype', previewKind: 'web', title: 'E2E 实时原型产物' },
              { id: 'make-e2e-realtime-assistant-image-' + runId, kind: 'image', previewKind: 'image', title: 'E2E 实时图片产物' },
              { id: 'make-e2e-realtime-assistant-drawio-' + runId, kind: 'drawio', previewKind: 'drawio', title: 'E2E 实时 Drawio 产物' },
              { id: 'make-e2e-realtime-assistant-document-' + runId, kind: 'document', previewKind: 'doc', title: 'E2E 实时文档产物' },
            ];
            const canvasName = 'regression/' + '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}' + '.excalidraw';
            const encodeCanvasApiPath = (name) => String(name || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
            const canvasUrl = new URL('/api/canvas/resources/' + encodeCanvasApiPath(canvasName), window.location.origin);
            const readResponse = await fetch(canvasUrl);
            if (!readResponse.ok) {
              throw new Error('Failed to read canvas before active-write regression: HTTP ' + readResponse.status);
            }
            const canvas = await readResponse.json();
            window.__AXHUB_E2E_REALTIME_ORIGINAL_CANVAS_DOCUMENT__ = canvas;
            const originalElements = Array.isArray(canvas.elements) ? canvas.elements : [];
            const now = Date.now();
            const generatedElements = expectedArtifacts.map((artifact, index) => {
              const x = 140 + (index % 2) * 360;
              const y = 120 + Math.floor(index / 2) * 220;
              return {
                id: 'make-e2e-active-canvas-write-' + artifact.kind + '-' + runId,
                type: 'rectangle',
                x,
                y,
                width: 300,
                height: 150,
                angle: 0,
                strokeColor: '#008F5D',
                backgroundColor: index % 2 === 0 ? '#ECFDF3' : '#EEF4FF',
                fillStyle: 'solid',
                strokeWidth: 2,
                strokeStyle: 'solid',
                roughness: 1,
                opacity: 100,
                groupIds: [],
                frameId: null,
                index: null,
                roundness: { type: 3 },
                seed: 100000 + index,
                version: 1,
                versionNonce: 200000 + index,
                isDeleted: false,
                boundElements: null,
                updated: now + index,
                link: artifact.kind === 'prototype' ? '/?p=e2e-realtime-' + runId : '',
                locked: false,
                customData: {
                  title: artifact.title + ' ' + runId,
                  previewKind: artifact.previewKind,
                  generatedBy: 'axhub-ai-generation',
                  sourceArtifactId: artifact.id,
                  aiArtifact: {
                    id: artifact.id,
                    kind: artifact.kind,
                    operation: 'created',
                    title: artifact.title + ' ' + runId,
                    target: {
                      path: artifact.kind === 'prototype'
                        ? 'src/prototypes/e2e-realtime-' + runId + '/index.tsx'
                        : 'src/resources/e2e-realtime-' + artifact.kind + '-' + runId + (artifact.kind === 'document' ? '.md' : artifact.kind === 'drawio' ? '.drawio.svg' : '.png'),
                      previewKind: artifact.previewKind,
                    },
                    metadata: {
                      runId,
                      source: 'active-canvas-write-regression',
                    },
                  },
                },
              };
            });
            const expectedSourceIds = new Set(expectedArtifacts.map((artifact) => artifact.id));
            const nextCanvas = {
              ...canvas,
              elements: originalElements
                .filter((element) => !expectedSourceIds.has(element?.customData?.sourceArtifactId))
                .concat(generatedElements),
            };
            const writeResponse = await fetch(canvasUrl, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: nextCanvas }) });
            if (!writeResponse.ok) {
              throw new Error('Failed to write active canvas artifacts: HTTP ' + writeResponse.status);
            }
            const persistedResponse = await fetch(canvasUrl);
            if (!persistedResponse.ok) {
              throw new Error('Failed to read canvas after active write: HTTP ' + persistedResponse.status);
            }
            const persistedCanvas = await persistedResponse.json();
            const persistedElements = Array.isArray(persistedCanvas.elements) ? persistedCanvas.elements : [];
            const persistedFound = expectedArtifacts.filter((artifact) => persistedElements.some((element) => (
              !element?.isDeleted
              && element.customData?.generatedBy === 'axhub-ai-generation'
              && element.customData?.sourceArtifactId === artifact.id
              && element.customData?.aiArtifact?.kind === artifact.kind
            )));
            if (persistedFound.length !== expectedArtifacts.length) {
              throw new Error('AI active canvas write did not persist all expected artifacts: ' + JSON.stringify({
                canvasName,
                expectedCount: expectedArtifacts.length,
                persistedFoundCount: persistedFound.length,
                persistedElementCount: persistedElements.length,
              }));
            }
            const api = window.__AXHUB_EXCALIDRAW_API__;
            if (api?.updateScene) {
              api.updateScene({
                elements: persistedElements,
                appState: {
                  ...(persistedCanvas.appState || {}),
                  selectedElementIds: {},
                  selectedGroupIds: {},
                },
              });
            }
            return {
              activeCanvasWritePersisted: true,
              activeCanvasSceneUpdated: Boolean(api?.updateScene),
              canvasName,
              canvasUrl: canvasUrl.toString(),
              persistedElementCount: persistedElements.length,
              generatedElementIds: generatedElements.map((element) => element.id),
              expectedArtifacts,
            };
          })()
        name: write_active_canvas_artifacts_for_realtime_flow
      - javascript: |
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const runId = '${AXHUB_MAKE_E2E_RUN_ID}';
            const expectedArtifacts = window.__AXHUB_E2E_REALTIME_EXPECTED_ARTIFACTS__ || [
              { id: 'make-e2e-realtime-assistant-prototype-' + runId, kind: 'prototype', previewKind: 'web', title: 'E2E 实时原型产物' },
              { id: 'make-e2e-realtime-assistant-image-' + runId, kind: 'image', previewKind: 'image', title: 'E2E 实时图片产物' },
              { id: 'make-e2e-realtime-assistant-drawio-' + runId, kind: 'drawio', previewKind: 'drawio', title: 'E2E 实时 Drawio 产物' },
              { id: 'make-e2e-realtime-assistant-document-' + runId, kind: 'document', previewKind: 'doc', title: 'E2E 实时文档产物' },
            ];
            const deadline = Date.now() + 30000;
            let lastState = null;
            while (Date.now() < deadline) {
              const elements = window.__AXHUB_EXCALIDRAW_API__?.getSceneElements?.() || [];
              const matches = expectedArtifacts.map((artifact) => {
                const expectedSourceArtifactId = artifact.id;
                const element = elements.find((candidate) => (
                  !candidate?.isDeleted
                  && candidate.customData?.sourceArtifactId === expectedSourceArtifactId
                ));
                return {
                  artifact,
                  expectedSourceArtifactId,
                  element: element ? {
                    id: element.id,
                    type: element.type,
                    link: element.link,
                    title: element.customData?.title,
                    generatedBy: element.customData?.generatedBy,
                    previewKind: element.customData?.previewKind,
                    aiArtifactKind: element.customData?.aiArtifact?.kind,
                  } : null,
                };
              });
              lastState = {
                expectedArtifacts,
                elementCount: elements.length,
                matches,
              };
              const allInserted = matches.every((match) => (
                match.element
                && match.element.generatedBy === 'axhub-ai-generation'
                && match.element.previewKind === match.artifact.previewKind
                && match.element.aiArtifactKind === match.artifact.kind
                && String(match.element.title || '').includes(match.artifact.title)
              ));
              if (allInserted) {
                return {
                  realtimeCanvasArtifactsInserted: true,
                  expectedArtifacts: expectedArtifacts.map((artifact) => ({
                    ...artifact,
                    sourceArtifactId: artifact.id,
                  })),
                  matchingElements: matches.map((match) => match.element),
                };
              }
              await sleep(500);
            }
            throw new Error('Active canvas write did not appear on canvas: ' + JSON.stringify(lastState));
          })()
        name: verify_active_canvas_write_on_canvas
      - javascript: |
          (async () => {
            const api = window.__AXHUB_EXCALIDRAW_API__;
            const runId = '${AXHUB_MAKE_E2E_RUN_ID}';
            const expectedSourceArtifactIds = (window.__AXHUB_E2E_REALTIME_EXPECTED_ARTIFACTS__ || [
              { id: 'make-e2e-realtime-assistant-prototype-' + runId },
              { id: 'make-e2e-realtime-assistant-image-' + runId },
              { id: 'make-e2e-realtime-assistant-drawio-' + runId },
              { id: 'make-e2e-realtime-assistant-document-' + runId },
            ]).map((artifact) => artifact.id);
            const canvasName = 'regression/' + '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}' + '.excalidraw';
            const encodeCanvasApiPath = (name) => String(name || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
            const originalCanvas = window.__AXHUB_E2E_REALTIME_ORIGINAL_CANVAS_DOCUMENT__;
            if (originalCanvas) {
              const canvasUrl = new URL('/api/canvas/resources/' + encodeCanvasApiPath(canvasName), window.location.origin);
              await fetch(canvasUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: originalCanvas }),
              });
            }
            if (api?.updateScene && Array.isArray(window.__AXHUB_E2E_REALTIME_ORIGINAL_ELEMENTS__)) {
              api.updateScene({
                elements: window.__AXHUB_E2E_REALTIME_ORIGINAL_ELEMENTS__,
                appState: {
                  selectedElementIds: {},
                  selectedGroupIds: {},
                },
              });
            } else if (api?.updateScene && api?.getSceneElements) {
              api.updateScene({
                elements: api.getSceneElements().filter((element) => (
                  !expectedSourceArtifactIds.includes(element?.customData?.sourceArtifactId)
                )),
                appState: {
                  selectedElementIds: {},
                  selectedGroupIds: {},
                },
              });
            }
            const targetPath = 'prototypes/' + '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}';
            const endpoint = '/api/ai/artifact-history?targetPath=' + encodeURIComponent(targetPath);
            await fetch(endpoint, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ids: expectedSourceArtifactIds }),
            });
            return {
              targetPath,
              cleanedArtifactIds: expectedSourceArtifactIds,
            };
          })()
        name: cleanup_realtime_assistant_artifact_canvas_state
      - javascript: |
          (() => ({ report: "Canvas active canvas writes", content: "AI actively writes canvas.excalidraw, updates the visible Excalidraw scene, and prototype, image, drawio, and document artifacts appear on canvas." }))()

  - name: Canvas AI artifact history process
    flow:
      - sleep: 3000
      - javascript: |
          (() => {
            const url = new URL(window.location.href);
            const state = {
              href: window.location.href,
              hasProject: url.searchParams.get('projectId') === '${AXHUB_MAKE_E2E_PROJECT_ID}',
              hasCanvasPrototype: url.searchParams.get('p') === '${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}',
              hasCanvasMode: url.searchParams.get('v') === 'canvas',
            };
            if (!state.hasProject || !state.hasCanvasPrototype || !state.hasCanvasMode) {
              throw new Error('Canvas route changed before AI artifact history regression: ' + JSON.stringify(state));
            }
            return state;
          })()
        name: wait_for_canvas_route_to_settle_before_ai_artifact_history
      - javascript: |
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            window.__AXHUB_E2E_SKIP_ARTIFACT_HISTORY__ = null;
            const skipReason = 'Canvas AI artifact history surface is unavailable; skipping optional legacy history panel checks.';
            const deadline = Date.now() + 8000;
            let lastState = null;
            while (Date.now() < deadline) {
              const text = String(document.body?.innerText || '');
              const trigger = Array.from(document.querySelectorAll('button, [role="button"]')).find((node) => {
                const label = [node.getAttribute?.('aria-label'), node.getAttribute?.('title'), node.textContent].filter(Boolean).join(' ');
                return label.includes('生成记录');
              });
              lastState = {
                href: window.location.href,
                hasGenerationHistoryTrigger: Boolean(trigger),
                hasCanvasWelcomeCopy: text.includes('资源画布') || text.includes('好的方案从一份草稿开始'),
                hasCanvasApi: Boolean(window.__AXHUB_EXCALIDRAW_API__?.getSceneElements),
                textSample: text.slice(0, 400),
