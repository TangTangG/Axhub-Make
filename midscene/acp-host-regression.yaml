                comments: [
                  {
                    id: 'midscene-comment-ai-smoke-' + runId,
                    elementKey: 'midscene-comment-ai-smoke-element',
                    label: 'Midscene AI smoke',
                    locator: {
                      selectors: ['[data-midscene-comment-ai-smoke]'],
                      fingerprint: 'midscene-comment-ai-smoke',
                      path: [],
                      shadowHostChain: [],
                    },
                    comment: commentText,
                    status: 'open',
                    createdAt: '2026-06-06T00:00:00.000Z',
                  },
                ],
                tasks: {
                  execute: {
                    id: 'midscene-comment-ai-smoke-task-' + runId,
                    status: 'pending',
                    commentIds: ['midscene-comment-ai-smoke-' + runId],
                  },
                },
                images: [],
              };
              const commentEndpoint = '/api/prototype-comments?targetPath=' + encodeURIComponent(targetPath);
              const saved = await putJson(commentEndpoint, { document });
              if (saved?.ok !== true || saved?.document?.comments?.[0]?.id !== document.comments[0].id) {
                throw new Error('Prototype comment write did not echo expected document: ' + JSON.stringify(saved));
              }
              const readbackResponse = await fetch(commentEndpoint);
              const readback = await readbackResponse.json().catch(() => null);
              if (!readbackResponse.ok || readback?.exists !== true || readback?.document?.tasks?.execute?.id !== document.tasks.execute.id) {
                throw new Error('Prototype comment readback failed: ' + JSON.stringify({ status: readbackResponse.status, readback }));
              }

              const aiResponse = await fetch('/api/ai/runs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  projectId: '${AXHUB_MAKE_E2E_PROJECT_ID}',
                  scene: 'prototype',
                  prompt: [
                    'Execute the Midscene deterministic prototype comment AI smoke.',
                    '',
                    '批注内容:',
                    '- ' + commentText,
                  ].join('\n'),
                  targetPath,
                  context: {
                    comments: readback.document.comments,
                    tasks: readback.document.tasks,
                  },
                  taskId: 'midscene-comment-ai-smoke-task-' + runId,
                  runId: 'midscene-comment-ai-smoke-run-' + runId,
                  conversationId: 'midscene-comment-ai-smoke-conversation-' + runId,
                }),
              });
              if (!aiResponse.ok) {
                throw new Error('AI run request failed: ' + JSON.stringify({ status: aiResponse.status, body: await aiResponse.text() }));
              }
              const execution = await readSseResponse(aiResponse);
              const eventTypes = execution.events.map((event) => event.event);
              const completed = execution.events.find((event) => event.event === 'run.completed');
              if (
                !eventTypes.includes('run.accepted') ||
                !eventTypes.includes('run.stage') ||
                !eventTypes.includes('run.text.delta') ||
                !completed ||
                completed.data?.status !== 'done' ||
                completed.data?.output !== expectedOutput ||
                (expectedProvider && completed.data?.provider !== expectedProvider) ||
                execution.text !== expectedOutput
              ) {
                throw new Error('AI run SSE did not complete as expected: ' + JSON.stringify({ eventTypes, completed, expectedProvider, text: execution.text, raw: execution.raw }));
              }
            return {
              targetPath,
              commentPath: saved.path,
              commentCount: saved.document.comments.length,
              eventTypes,
              output: completed.data.output,
              provider: completed.data.provider,
              mockWebBaseUrl,
              mockApiBaseUrl,
            };
          })()
