      - javascript: |
          (async () => {
            const acpReady = '${AXHUB_ACP_UI_READY}' === 'true';
            if (!acpReady) {
              return { skipped: true };
            }

            const iframe = Array.from(document.querySelectorAll('iframe')).find((candidate) => {
              const title = candidate.title || '';
              const src = candidate.src || '';
              return title.includes('ACP') || src.includes('${AXHUB_ACP_UI_BASE_URL}') || src.includes('${AXHUB_MAKE_E2E_MOCK_ACP_WEB_BASE_URL}');
            });
            if (!iframe?.contentWindow) {
              throw new Error('ACP iframe is not available for postMessage context test.');
            }

            const requestId = 'make-e2e-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            const expectedPath = 'src/resources/regression/${AXHUB_MAKE_E2E_CANVAS_PROTOTYPE}.excalidraw';
            const targetOrigin = new URL(iframe.src).origin;
            const result = await new Promise((resolve, reject) => {
              const retryTimers = [];
              let settled = false;
              const cleanup = () => {
                window.removeEventListener('message', onMessage);
                retryTimers.forEach((timer) => window.clearTimeout(timer));
              };
              const timeout = window.setTimeout(() => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(new Error('Timed out waiting for acp.context.result'));
              }, 12000);
              function onMessage(event) {
                if (event.source !== iframe.contentWindow) return;
                if (event.origin !== targetOrigin) return;
                const data = event.data || {};
                if (data.requestId !== requestId) return;
                if (data.type === 'acp.context.result') {
                  if (settled) return;
                  settled = true;
                  window.clearTimeout(timeout);
                  cleanup();
                  resolve(data.payload);
                } else if (data.type === 'acp.context.error') {
                  if (settled) return;
                  settled = true;
                  window.clearTimeout(timeout);
                  cleanup();
                  reject(new Error(JSON.stringify(data.payload)));
                }
              }
              window.addEventListener('message', onMessage);
              const message = {
                type: 'acp.context.replace',
                requestId,
                payload: {
                  items: [
                    {
                      kind: 'file',
                      id: 'make-e2e-current-canvas',
                      path: expectedPath,
                      name: 'canvas.excalidraw',
                      description: 'Injected from Axhub Make ACP host regression.',
                      metadata: {
                        source: 'axhub-make-e2e',
                        projectId: '${AXHUB_MAKE_E2E_PROJECT_ID}',
                      },
                    },
                    {
                      kind: 'annotation',
                      id: 'make-e2e-canvas-annotation',
                      body: 'Midscene host regression annotation',
                      target: {
                        type: 'canvas-element',
                        filePath: expectedPath,
                        elementId: 'midscene-e2e-element',
                        elementType: 'rectangle',
                        label: 'host regression element',
                      },
                      source: 'axhub-make-e2e',
                    },
                  ],
                },
              };
              const postContext = () => iframe.contentWindow?.postMessage(message, targetOrigin);
              postContext();
              retryTimers.push(window.setTimeout(postContext, 160));
              retryTimers.push(window.setTimeout(postContext, 520));
              retryTimers.push(window.setTimeout(postContext, 1200));
              retryTimers.push(window.setTimeout(postContext, 2500));
            });
            const items = Array.isArray(result?.context?.items) ? result.context.items : [];
            const hasFile = items.some((item) => item.kind === 'file' && item.id === 'make-e2e-current-canvas' && item.path === expectedPath);
            const hasAnnotation = items.some((item) => item.kind === 'annotation' && item.id === 'make-e2e-canvas-annotation');
            if (!result?.ok || !hasFile || !hasAnnotation) {
              throw new Error(JSON.stringify({ result, expectedPath, hasFile, hasAnnotation }));
            }
            return {
              ok: result.ok,
              itemCount: items.length,
              hasFile,
              hasAnnotation,
              updatedAt: result.context?.updatedAt,
            };
          })()
        name: acp_context_postmessage_roundtrip
      - javascript: |
          (() => ({ report: "ACP iframe context", content: "Ready-state checks open the ACP iframe and validate acp.context.replace round-trip when ACP UI is available." }))()
